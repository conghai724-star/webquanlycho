<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="rocketBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </linearGradient>
    <linearGradient id="rocketFinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Exhaust Flame Group with class for CSS animation -->
  <g class="rocket-exhaust-flame" filter="url(#flameGlow)">
    <!-- Outer Flame -->
    <path fill="url(#flameGrad)" class="flame-outer" d="M85 135 Q70 170 60 195 Q85 180 100 145 Z"/>
    <path fill="#f97316" class="flame-mid" d="M88 135 Q78 165 70 185 Q88 172 98 143 Z"/>
    <!-- Inner Yellow Core -->
    <path fill="#fef08a" class="flame-inner" d="M90 135 Q84 155 78 172 Q92 162 97 140 Z"/>
  </g>

  <!-- Engine Nozzle -->
  <path fill="#ea580c" d="M83 130 L97 140 L90 145 L76 135 Z"/>

  <!-- Left Blue Wing/Fin -->
  <path fill="url(#rocketFinGrad)" d="M75 90 L32 110 C25 125 35 145 55 140 L82 125 Z"/>
  <path fill="#0369a1" d="M52 112 L32 110 C25 125 35 145 55 140 L62 128 Z"/>

  <!-- Right Blue Wing/Fin -->
  <path fill="url(#rocketFinGrad)" d="M110 55 L130 32 C145 25 165 35 160 55 L145 82 Z"/>
  <path fill="#0284c7" d="M132 52 L130 32 C145 25 165 35 160 55 L148 62 Z"/>

  <!-- Main Red Rocket Body -->
  <path fill="url(#rocketBodyGrad)" d="M150 45 C125 10 75 40 60 70 C48 95 65 125 80 130 C95 135 125 152 150 140 C180 125 185 75 150 45 Z"/>
  <!-- Streamlined Body Cut -->
  <path fill="#dc2626" d="M142 42 C120 15 75 42 62 70 C52 92 68 120 80 126 L142 42 Z"/>

  <!-- Black Body Stripe -->
  <path fill="#1e293b" d="M78 122 L132 68 L126 62 L72 116 Z"/>

  <!-- Silver Band below Nose -->
  <path fill="#cbd5e1" d="M125 25 L137 37 L147 27 L135 15 Z"/>

  <!-- Black Nose Cone Tip -->
  <path fill="#0f172a" d="M135 15 L147 27 C155 19 156 12 150 6 C144 0 137 7 135 15 Z"/>
</svg>
